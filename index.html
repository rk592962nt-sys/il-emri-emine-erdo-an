<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweet Kuyruğu</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#222}
.container{max-width:600px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px #0001}
h1{text-align:center;margin-top:0}
#counter{text-align:center;color:#666;margin-bottom:15px}
textarea{width:100%;box-sizing:border-box;min-height:150px;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 15px;margin:5px 2px;font-size:15px;cursor:pointer}
.primary{background:#111;color:#fff}
.secondary{background:#eee}
.danger{background:#f3d6d6}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}
.small{text-align:center;color:#777;font-size:13px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h1>Tweet Kuyruğu</h1>
<div id="counter">1 / 1</div>

<textarea id="tweet" placeholder="Yanıt metnini buraya yaz..."></textarea>

<div class="row">
<button class="secondary" onclick="previousTweet()">← Önceki</button>
<button class="secondary" onclick="nextTweet()">Sonraki →</button>
</div>

<div class="row">
<button class="primary" onclick="copyTweet()">Metni Kopyala</button>
<button class="primary" onclick="replyOnX()">𝕏 Yanıtla</button>
</div>

<div class="row">
<button class="secondary" onclick="addTweet()">+ Yeni Metin</button>
<button class="danger" onclick="deleteTweet()">Bu Metni Sil</button>
</div>

<div class="small">
Yanıtlar, belirtilen X gönderisinin cevap ekranında açılır. Gönderme işlemi X üzerinde manuel yapılır.
</div>
</div>

<script>
const POST_ID = "2102292384927129784";
const STORAGE_KEY = "tweetQueue_emine_erdogan";

let tweets = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let index = 0;

if (!tweets.length) tweets = [""];

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tweets));
}

function render(){
  document.getElementById("tweet").value = tweets[index] || "";
  document.getElementById("counter").textContent = `${index + 1} / ${tweets.length}`;
}

document.getElementById("tweet").addEventListener("input", function(){
  tweets[index] = this.value;
  save();
});

function nextTweet(){
  if(index < tweets.length - 1){
    index++;
  } else {
    tweets.push("");
    index++;
    save();
  }
  render();
}

function previousTweet(){
  if(index > 0){
    index--;
    render();
  }
}

function addTweet(){
  tweets.splice(index + 1, 0, "");
  index++;
  save();
  render();
  document.getElementById("tweet").focus();
}

function deleteTweet(){
  if(tweets.length === 1){
    tweets[0] = "";
  } else {
    tweets.splice(index, 1);
    if(index >= tweets.length) index = tweets.length - 1;
  }
  save();
  render();
}

async function copyTweet(){
  const text = tweets[index] || "";
  await navigator.clipboard.writeText(text);
  alert("Metin kopyalandı.");
}

function replyOnX(){
  const text = tweets[index] || "";
  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&in_reply_to=" +
    POST_ID;
  window.open(url, "_blank");
}

render();
</script>
</body>
</html>
