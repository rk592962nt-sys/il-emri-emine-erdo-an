<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metin Kuyruğu</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#222}.container{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px #0001}h1{text-align:center}#counter{text-align:center;color:#666;margin-bottom:15px}textarea{width:100%;box-sizing:border-box;min-height:190px;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;line-height:1.45}button{border:0;border-radius:10px;padding:12px 15px;margin:5px 2px;font-size:15px}.primary{background:#111;color:#fff}.secondary{background:#eee}.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}.small{text-align:center;color:#777;font-size:13px;margin-top:15px}</style></head><body><div class="container"><h1>Metin Kuyruğu</h1><div id="counter"></div><textarea id="text"></textarea><div class="row"><button class="secondary" onclick="prev()">← Önceki</button><button class="secondary" onclick="next()">Sonraki →</button></div><div class="row"><button class="primary" onclick="copyText()">Metni Kopyala</button></div><div class="row"><button class="secondary" onclick="add()">+ Yeni Metin</button><button class="secondary" onclick="remove()">Bu Metni Sil</button></div><p class="small">Taslaklar cihazında saklanır. Otomatik gönderim yapılmaz.</p></div><script>
const initial=["Sayın Emine Erdoğan, bir öğretmen olarak size sesleniyorum. Ailemden ayrı kalmak istemiyorum. Mazeret tayininde yerleşemedim. İl emrinin tüm mağdur öğretmenlere verilmesi için lütfen sesimiz olun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, biz öğretmenler çocuklarımıza aile olmanın değerini anlatıyoruz. Kendi ailelerimizden ayrı kalmak istemiyoruz. İl emri için desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bugün sizden sadece bir öğretmenin değil, ailesine kavuşmayı bekleyen binlerce öğretmenin sesi olmanızı rica ediyoruz. İl emri tüm mağdurları kapsasın. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bazen bir destek binlerce insan için umut olabilir. Bizim umudumuz sizsiniz. İl emri konusunda sesimizi Sayın Bakanımıza ulaştırmanızı rica ediyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, aile bütünlüğü bizim için bir cümleden ibaret değil. Eşimizden, çocuklarımızdan ve sevdiklerimizden ayrı yaşamak istemiyoruz. İl emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, size bir öğretmen olarak değil, ailesine kavuşmak isteyen bir insan olarak sesleniyorum. Lütfen bizi duyun. İl emri bizim için ailemize dönüş demek. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, mazeret tayininde yerleşemeyen öğretmenlerin yaşadığı mağduriyeti görmenizi istiyoruz. İl emriyle aileler yeniden bir araya gelsin. #EmineHanımöğretmenlerinyanında", "Emine Hanım, yıllardır ülkenin farklı yerlerinde görev yaptık. Şimdi tek isteğimiz ailemizin yanında görev yapabilmek. İl emri için desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, öğretmenlerimizin ailelerinden ayrı kalmaması için sizin sesinize ihtiyacımız var. Lütfen il emri talebimizi duyurun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bir anne ve bir kadın olarak aile bütünlüğünün önemini anlayacağınıza inanıyoruz. Biz de ailelerimize kavuşmak istiyoruz. İl emri istiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bugün binlerce öğretmenin gözü sizden gelecek güzel bir haberde. İl emrinin tüm mağdur öğretmenleri kapsaması için desteğinizi rica ediyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, biz ayrıcalık istemiyoruz. Mazereti nedeniyle tayin isteyen ve yerleşemeyen öğretmenlere ailelerinin yanında görev yapabilme imkânı istiyoruz. İl emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bir öğretmenin ailesine kavuşması yalnızca bir atama sonucu değildir; bir evin yeniden huzura kavuşmasıdır. Lütfen il emri için sesimiz olun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bu mesajı binlerce öğretmenin adına yazıyorum. Her birimizin arkasında ailesine kavuşmayı bekleyen insanlar var. Lütfen sesimizi duyun. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, öğretmenlerin aile bütünlüğü için beklediği il emri müjdesinin tüm mağdur öğretmenleri kapsamasını gönülden istiyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bugün sizden istediğimiz tek şey sesimizi duyurmanız. Mazeret tayininde yerleşemeyen öğretmenler olarak il emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, öğretmenler çocuklarımıza aile sevgisini anlatırken kendi ailelerinden uzak kalmasın. Lütfen bu mağduriyetin çözümü için yanımızda olun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, ailemizden uzakta görev yaparken her gün “ne zaman kavuşacağız?” diye düşünüyoruz. İl emri bizim için çok büyük bir umut. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, binlerce öğretmenin ortak dileği çok açık: Ailemizle aynı şehirde yaşayabilmek. Bunun için il emri talep ediyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, lütfen öğretmenlerin bu sessiz çığlığını duyun. Ailelerinden ayrı kalan öğretmenler olarak il emri müjdesi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bir öğretmenin ailesine kavuşmasına vesile olacak desteğiniz, binlerce aile için unutulmaz bir umut olabilir. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bugün bizlerin kalbinde tek bir dilek var: Ailelerimizle aynı şehirde yaşamak. İl emrinin tüm mağdurlara verilmesi için desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, aile bütünlüğü için mücadele eden öğretmenlerin sesini Sayın Bakanımıza ulaştırmanızı rica ediyoruz. Biz sadece ailemize kavuşmak istiyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bu süreçte bize umut olacak bir ses arıyoruz. Sizden ricamız, il emri talebimizi görmeniz ve desteklemeniz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, mazeret tayini gerçekleşmeyen öğretmenlerin mağduriyetinin giderilmesi için il emri uygulanmasını istiyoruz. Lütfen sesimiz olun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, ailelerinden ayrı yaşamak zorunda kalan öğretmenlerin sesini duyun. Bizler görevimizden kaçmak değil, ailemizle birlikte görev yapmak istiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, öğretmenler olarak ülkemizin dört bir yanında görev yaptık. Şimdi ailelerimizin yanında olabilmek için sizden destek bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bir öğretmenin ailesinden ayrı geçirdiği her günün ne kadar zor olduğunu düşünmenizi rica ediyoruz. İl emriyle bu ayrılık sona ersin. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, aileleri birleştiren her adımın çok kıymetli olduğuna inanıyoruz. Öğretmenlerin il emri talebine siz de destek olun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bugün sizden bir müjde bekliyoruz. İl emri tüm mağdur öğretmenleri kapsasın ve aileler yeniden aynı çatı altında buluşsun. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, belki bu mesaj binlercesinden sadece biri ama arkasında gerçek bir ailenin özlemi var. Lütfen sesimizi duyun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, öğretmenlerin ailesinin yanında görev yapabilmesi için il emrinin herkesi kapsamasını istiyoruz. Bu konuda desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, ailelerimizden uzak kalmak bizim tercihimiz değil. Mazeretimiz nedeniyle tayin istedik ancak yerleşemedik. Şimdi il emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, öğretmenlerin de huzurlu bir aile hayatına hakkı var. İl emriyle aile bütünlüğümüzün korunmasını istiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, sizden ricamız bu mağduriyeti görün ve öğretmenlerin sesi olun. İl emriyle binlerce aile yeniden birleşebilir. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bugün bir öğretmenin değil, aynı özlemi yaşayan binlerce öğretmenin adına yazıyoruz. Ailelerimizden ayrı kalmak istemiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, aile bütünlüğü için çıktığımız bu yolda sizin desteğiniz bizim için çok değerli. İl emrinin tüm mağdurlara verilmesini rica ediyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, öğretmenler olarak çocuklarımızın geleceği için çalışıyoruz. Biz de kendi ailelerimizle aynı şehirde bir gelecek kurmak istiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, ailemizin yanında olabilmek için sizden destek bekliyoruz. Lütfen il emri talebimizi Sayın Bakanımıza iletin. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bazen bir “evet” binlerce insanın hayatında yeni bir sayfa açabilir. Biz bugün o umudu taşıyoruz. İl emri müjdesini bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, ailelerinden ayrı kalan öğretmenlerin sesi olun. İl emri tüm mağdur öğretmenleri kapsasın, aileler birbirine kavuşsun. #EmineHanımöğretmenlerinyanında", "Emine Hanım, bu mücadelede sizden yanımızda olduğunuzu hissetmek istiyoruz. Lütfen öğretmenlerin il emri talebine destek olun. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bir öğretmenin en büyük huzuru ailesinin yanında görev yapabilmesidir. Bu huzura kavuşabilmemiz için il emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, öğretmenlerin de aileleriyle birlikte yaşayabilmeye ihtiyacı var. İl emriyle bu ayrılığın sona ermesini istiyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, bizler görevimizi yapmak istiyoruz ama ailelerimizden kopmadan. İl emriyle bu mümkün olabilir. Desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, size ulaşan bu mesajı bir ricamız olarak kabul edin: Mazeret tayininde yerleşemeyen tüm öğretmenler için il emri verilsin. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, ailelerimizin yanında olabilmek için günlerdir umutla bekliyoruz. Bu umudu güzel bir müjdeye dönüştürmenizi rica ediyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, öğretmenlerin ailelerinden ayrı kalmadığı, çocuklarımızın da anne babalarına kavuştuğu bir çözüm istiyoruz. İl emri bekliyoruz. #EmineHanımöğretmenlerinyanında", "Sayın Emine Erdoğan, sesimizi duyarsanız yalnızca öğretmenleri değil, öğretmenlerin ailelerini de mutlu etmiş olacaksınız. İl emri için desteğinizi bekliyoruz. #EmineHanımöğretmenlerinyanında", "Emine Hanım, binlerce öğretmenin kalbinden geçen tek bir dilek var: Ailemize kavuşmak. Lütfen sesimizi duyun, il emri müjdesinin tüm mağdurları kapsamasına destek olun. #EmineHanımöğretmenlerinyanında"];let q=JSON.parse(localStorage.getItem("draftQueue50")||"null")||initial,i=0;
const t=document.getElementById("text"),c=document.getElementById("counter");
function save(){localStorage.setItem("draftQueue50",JSON.stringify(q));}
function render(){t.value=q[i]||"";c.textContent=(i+1)+" / "+q.length;}
t.oninput=()=>{q[i]=t.value;save();};
function next(){if(i<q.length-1)i++;else{q.push("");i=q.length-1;}render();save();}
function prev(){if(i>0)i--;render();}
function add(){q.splice(i+1,0,"");i++;render();save();t.focus();}
function remove(){if(q.length===1)q[0]="";else{q.splice(i,1);if(i>=q.length)i=q.length-1;}render();save();}
async function copyText(){await navigator.clipboard.writeText(q[i]||"");alert("Metin kopyalandı.");}
render();
</script></body></html>
